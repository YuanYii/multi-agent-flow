# ==============================================================================
# Multi-Agent Team Workflow Skill 配置模板
# ==============================================================================

# 项目基本信息
project:
  name: "Sample-Project"
  version: "1.0.0"
  root_dir: "./"

# 看板配置 (支持 feishu_base, jira, github_projects, local)
# 离线模式示例 (无需任何凭证/网络, 数据存本地 kanban/board.json):
#   board:
#     provider: "local"
#     board_file: "kanban/board.json"   # 离线看板 JSON 文件路径
#     fields:
#       task_id: "task_id"
#       task_name: "task_name"
#       status: "status"
#       assignee: "assignee"
#       owner: "owner"
#       end_time: "end_time"
#       remarks: "remarks"
board:
  provider: "feishu_base"
  base_token: "${FEISHU_BASE_TOKEN}" # 示例: XdBTbXwAzaDb9Bs9yoQc5i6UnPf
  table_id: "${FEISHU_TABLE_ID}"     # 示例: tblQps5uiVbfgwIP
  
  # 看板字段 ID 或 字段名映射 (可通过 scripts/init_field_mapping.py 自动生成)
  fields:
    task_id: "fldfncoTK7"       # 任务编号 (如 T0001)
    wbs_id: "fldRra5C9P"        # WBS编号 (如 1.1.1)
    task_name: "fldNqYVccZ"     # 任务名称与要求
    status: "fldfN1eS1S"        # 任务状态
    assignee: "fldrvarNqj"      # 处理人
    owner: "fldiRgXqhx"         # 负责人
    priority: "fldfa1F3iw"      # 优先级
    estimated_hours: "fldMHIPkjS" # 预估工时(h)
    actual_hours: "fldRbzGgjW"  # 实际工时(h)
    start_time: "fldOrFVNpW"    # 开始时间
    end_time: "fldQh4MOz1"      # 结束时间
    created_date: "fldqQlgMnh"  # 创建日期
    stage: "fldFPtDG9k"         # 项目阶段
    workpackage: "fldh7JffAE"   # 工作包
    process_desc: "fldvBk1qEc"  # 过程描述
    remarks: "fldw6i3OwX"       # 备注 (缺陷结构化信息)
    attachment: "fldJYn3sdS"    # 附件

# 专家角色团队配置与权限映射
roles:
  PM:
    name: "项目经理"
    assignee_value: "PM_User"
    max_parallel_tasks: 99
    can_self_claim: false
  ARCHITECT:
    name: "架构师"
    assignee_value: "Architect_User"
    max_parallel_tasks: 99
    can_self_claim: false
  DEV:
    name: "全栈开发工程师"
    assignee_value: ["Dev_User_1", "Dev_User_2"]
    max_parallel_tasks: 3
    can_self_claim: true
  FRONTEND:
    name: "前端开发工程师"
    assignee_value: ["Frontend_User"]
    max_parallel_tasks: 3
    can_self_claim: true
  REVIEWER:
    name: "代码审查专家"
    assignee_value: "Reviewer_User"
    max_parallel_tasks: 99
    can_self_claim: false
  QA:
    name: "测试工程师"
    assignee_value: "QA_User"
    max_parallel_tasks: 99
    can_self_claim: false
  DOCS:
    name: "文档工程师"
    assignee_value: "Docs_User"
    max_parallel_tasks: 99
    can_self_claim: false
  DEVOPS:
    name: "Git与运维管理员"
    assignee_value: "DevOps_User"
    max_parallel_tasks: 99
    can_self_claim: false

# 文档与产出目录映射
paths:
  docs_root: "docs/"
  task_breakdown_dir: "docs/workpackages/"
  dev_reports_dir: "docs/reports/dev/"
  review_reports_dir: "docs/reports/review/"
  qa_reports_dir: "docs/reports/qa/"
  summary_dir: "docs/reports/summary/"
  problem_records_dir: "docs/reports/problems/"
