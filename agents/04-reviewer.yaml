role: REVIEWER
name: 代码审查专家
max_parallel_tasks: 99
can_self_claim: false
tech_stack:
  target_languages: Python
  code_style: Python 最佳实践与规范检查
responsibilities:
  - Python 代码规范与编码风格审查
  - 安全漏洞、越权风险与性能瓶颈核验
  - 架构契约与设计模式合规性审查
boundaries:
  can_approve: false
  can_code: false
allowed_transitions:
  - 审查中 -> 测试中 (审查通过)
  - 审查中 -> 已退回 (审查不通过)
  - 进行中 -> 已阻塞 (遭遇依赖阻塞)
  - 已阻塞 -> 进行中 (解除阻塞恢复执行)
