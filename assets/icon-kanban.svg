<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="YY-Flow 多专家协同研发工作流图标 — 看板流转">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C6CF0"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="200" height="200" rx="46" fill="url(#bg)"/>
  <rect width="200" height="200" rx="46" fill="url(#vign)"/>

  <!-- 顶部流转箭头（状态推进） -->
  <path d="M48 40 C 100 16, 100 16, 152 40" fill="none" stroke="url(#flow)" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah3)"/>

  <!-- 三列看板 -->
  <g>
    <rect x="30"  y="54" width="40" height="94" rx="11" fill="#16233B" stroke="#334155" stroke-width="1.5"/>
    <rect x="80"  y="54" width="40" height="94" rx="11" fill="#16233B" stroke="#334155" stroke-width="1.5"/>
    <rect x="130" y="54" width="40" height="94" rx="11" fill="#16233B" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- 列头标识点（8 专家取色） -->
  <g filter="url(#glow)">
    <circle cx="50"  cy="68" r="4.5" fill="#F43F5E"/>
    <circle cx="100" cy="68" r="4.5" fill="#7C6CF0"/>
    <circle cx="150" cy="68" r="4.5" fill="#38BDF8"/>
  </g>

  <!-- 卡片 -->
  <g>
    <rect x="37" y="80"  width="26" height="15" rx="4" fill="#38BDF8"/>
    <rect x="37" y="100" width="26" height="15" rx="4" fill="#6366F1"/>
    <rect x="37" y="120" width="26" height="15" rx="4" fill="#475569"/>

    <rect x="87" y="80"  width="26" height="15" rx="4" fill="#A855F7"/>
    <rect x="87" y="100" width="26" height="15" rx="4" fill="#7C6CF0"/>
    <rect x="87" y="120" width="26" height="15" rx="4" fill="#475569"/>

    <rect x="137" y="80"  width="26" height="15" rx="4" fill="#10B981" filter="url(#glow)"/>
    <rect x="137" y="100" width="26" height="15" rx="4" fill="#2DD4BF"/>
  </g>
</svg>
