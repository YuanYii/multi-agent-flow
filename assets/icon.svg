<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#0284C7"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#03456C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 外框背景 -->
  <rect x="112" y="112" width="800" height="800" rx="240" fill="url(#bg)"/>
  
  <!-- 顶部清晰粗体 MULTI-AGENT 文字 (字号 52px 特粗) -->
  <g filter="url(#textShadow)">
    <circle cx="270" cy="202" r="7" fill="#38BDF8"/>
    <text x="512" y="218" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="5.5">MULTI-AGENT</text>
    <circle cx="754" cy="202" r="7" fill="#10B981" filter="url(#glow)"/>
  </g>

  <!-- 三列看板 (主体保持不变) -->
  <g fill="#FFFFFF">
    <rect x="252" y="270" width="136" height="428" rx="52"/>
    <rect x="444" y="270" width="136" height="428" rx="52"/>
    <rect x="636" y="270" width="136" height="428" rx="52"/>
  </g>
  
  <!-- 列头状态点 -->
  <circle cx="320" cy="310" r="15" fill="#0284C7"/>
  <circle cx="512" cy="310" r="15" fill="none" stroke="#0D9488" stroke-width="8"/>
  <circle cx="704" cy="310" r="15" fill="#E11D48"/>
  
  <!-- 任务卡片 -->
  <rect x="276" y="352" width="88" height="64" rx="18" fill="#075985"/>
  <rect x="468" y="352" width="88" height="64" rx="18" fill="#075985"/>
  <rect x="660" y="352" width="88" height="64" rx="18" fill="#075985"/>
  <rect x="660" y="436" width="88" height="64" rx="18" fill="#075985"/>
  <rect x="660" y="520" width="88" height="64" rx="18" fill="#075985" fill-opacity="0.55"/>
  
  <!-- 进行中卡片 + 白色对勾 -->
  <rect x="468" y="436" width="88" height="120" rx="18" fill="#0E7490"/>
  <path d="M492 496 L512 516 L540 486" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 底部单向箭头流转轨道 (所选定的优化轨道) -->
  <line x1="252" y1="752" x2="772" y2="752" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  
  <!-- 起点 -->
  <circle cx="320" cy="752" r="18" fill="#075985" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="320" cy="752" r="6" fill="#FFFFFF"/>

  <!-- 箭头 1 -->
  <path d="M 408 740 L 424 752 L 408 764" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 中继 -->
  <circle cx="512" cy="752" r="20" fill="#0E7490" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="512" cy="752" r="7" fill="#FFFFFF"/>

  <!-- 箭头 2 -->
  <path d="M 600 740 L 616 752 L 600 764" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 终态验收 -->
  <circle cx="704" cy="752" r="22" fill="#10B981" stroke="#FFFFFF" stroke-width="5" filter="url(#glow)"/>
  <path d="M 696 752 L 702 758 L 713 746" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
