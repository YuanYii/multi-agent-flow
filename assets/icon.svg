<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#0284C7"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 主体完全不变 -->
  <rect x="112" y="112" width="800" height="800" rx="240" fill="url(#bg)"/>
  
  <!-- 三列看板 (原版保持不变) -->
  <g fill="#FFFFFF">
    <rect x="252" y="286" width="136" height="428" rx="52"/>
    <rect x="444" y="286" width="136" height="428" rx="52"/>
    <rect x="636" y="286" width="136" height="428" rx="52"/>
  </g>
  
  <!-- 列头状态点 (原版保持不变) -->
  <circle cx="320" cy="326" r="15" fill="#0284C7"/>
  <circle cx="512" cy="326" r="15" fill="none" stroke="#0D9488" stroke-width="8"/>
  <circle cx="704" cy="326" r="15" fill="#E11D48"/>
  
  <!-- 任务卡片 (原版保持不变) -->
  <rect x="276" y="368" width="88" height="64" rx="18" fill="#075985"/>
  <rect x="468" y="368" width="88" height="64" rx="18" fill="#075985"/>
  <rect x="660" y="368" width="88" height="64" rx="18" fill="#075985"/>
  <rect x="660" y="452" width="88" height="64" rx="18" fill="#075985"/>
  <rect x="660" y="536" width="88" height="64" rx="18" fill="#075985" fill-opacity="0.55"/>
  
  <!-- 进行中卡片 + 白色对勾 (原版保持不变) -->
  <rect x="468" y="452" width="88" height="120" rx="18" fill="#0E7490"/>
  <path d="M492 512 L512 532 L540 502" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ========== 底部流转优化：方案 1 动态单向箭头轨道 (Arrow Pipeline) ========== -->
  <!-- 主流转白轨 -->
  <line x1="252" y1="760" x2="772" y2="760" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  
  <!-- 起点节点：待开始 (深蓝实心 + 纯白外圈) -->
  <circle cx="320" cy="760" r="18" fill="#075985" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="320" cy="760" r="6" fill="#FFFFFF"/>

  <!-- 单向流转箭头 1 -->
  <path d="M 408 748 L 424 760 L 408 772" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 中继节点：进行中 (活跃光环 + 纯白内核) -->
  <circle cx="512" cy="760" r="20" fill="#0E7490" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="512" cy="760" r="7" fill="#FFFFFF"/>

  <!-- 单向流转箭头 2 -->
  <path d="M 600 748 L 616 760 L 600 772" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 终态节点：已验收 (高亮翡翠绿 + 纯白对勾闭环) -->
  <circle cx="704" cy="760" r="22" fill="#10B981" stroke="#FFFFFF" stroke-width="5" filter="url(#glow)"/>
  <path d="M 696 760 L 702 766 L 713 754" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
