<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="YY-Flow 多专家协同研发工作流图标 — 阶段双向门禁">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C6CF0"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CF0"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7C6CF0"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="200" height="200" rx="46" fill="url(#bg)"/>
  <rect width="200" height="200" rx="46" fill="url(#vign)"/>

  <!-- 左侧入口 (START - 开工准入) -->
  <g>
    <text x="26" y="32" font-family="-apple-system,system-ui,sans-serif" font-size="7.5" fill="#7C6CF0" font-weight="700" letter-spacing="1">START</text>
    <text x="26" y="42" font-family="-apple-system,system-ui,sans-serif" font-size="6.5" fill="#94A3B8" letter-spacing="0.3">开工准入</text>
    <path d="M26 52 L58 52" fill="none" stroke="#7C6CF0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah1)"/>
  </g>

  <!-- 右侧出口 (CLOSE - 结项准出) -->
  <g>
    <text x="174" y="32" font-family="-apple-system,system-ui,sans-serif" font-size="7.5" fill="#10B981" text-anchor="end" font-weight="700" letter-spacing="1">CLOSE</text>
    <text x="174" y="42" font-family="-apple-system,system-ui,sans-serif" font-size="6.5" fill="#94A3B8" text-anchor="end" letter-spacing="0.3">结项准出</text>
    <path d="M142 52 L174 52" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah2)"/>
  </g>

  <!-- 中央 Stage Gate 门框 -->
  <g>
    <!-- 顶梁 -->
    <rect x="56" y="60" width="88" height="10" rx="3" fill="url(#gate)" filter="url(#glow)"/>
    <!-- 顶梁标签 -->
    <text x="100" y="67.5" font-family="-apple-system,system-ui,sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="700" letter-spacing="2">STAGE GATE</text>

    <!-- 左柱 -->
    <rect x="56" y="70" width="6" height="92" rx="2" fill="#16233B" stroke="#7C6CF0" stroke-width="1.5"/>
    <!-- 右柱 -->
    <rect x="138" y="70" width="6" height="92" rx="2" fill="#16233B" stroke="#10B981" stroke-width="1.5"/>

    <!-- 底座 -->
    <rect x="50" y="160" width="100" height="6" rx="2" fill="url(#gate)" opacity="0.7"/>

    <!-- 门内：5 项硬核验清单 -->
    <g>
      <!-- 1. 看板终态 -->
      <g transform="translate(70 82)">
        <rect x="-1.5" y="-2.5" width="9" height="9" rx="1.5" fill="none" stroke="#10B981" stroke-width="1.3"/>
        <path d="M-0.5 2 L2 4.5 L7 -1.5" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="14" y="3.5" font-family="-apple-system,system-ui,sans-serif" font-size="6.5" fill="#CBD5E1">看板终态</text>
      </g>
      <!-- 2. WBS 对账 -->
      <g transform="translate(70 102)">
        <rect x="-1.5" y="-2.5" width="9" height="9" rx="1.5" fill="none" stroke="#10B981" stroke-width="1.3"/>
        <path d="M-0.5 2 L2 4.5 L7 -1.5" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="14" y="3.5" font-family="-apple-system,system-ui,sans-serif" font-size="6.5" fill="#CBD5E1">WBS 对账</text>
      </g>
      <!-- 3. 架构总结 -->
      <g transform="translate(70 122)">
        <rect x="-1.5" y="-2.5" width="9" height="9" rx="1.5" fill="none" stroke="#10B981" stroke-width="1.3"/>
        <path d="M-0.5 2 L2 4.5 L7 -1.5" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="14" y="3.5" font-family="-apple-system,system-ui,sans-serif" font-size="6.5" fill="#CBD5E1">架构总结</text>
      </g>
      <!-- 4. PM 复盘 -->
      <g transform="translate(70 142)">
        <rect x="-1.5" y="-2.5" width="9" height="9" rx="1.5" fill="none" stroke="#FBBF24" stroke-width="1.3"/>
        <text x="14" y="3.5" font-family="-apple-system,system-ui,sans-serif" font-size="6.5" fill="#CBD5E1">PM 复盘</text>
      </g>
    </g>

    <!-- 右柱阶段标识 (S1-S4) -->
    <g font-family="-apple-system,system-ui,sans-serif" font-size="7" text-anchor="middle">
      <circle cx="118" cy="86"  r="6.5" fill="#0B1120" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="118" y="89"  fill="#38BDF8" font-weight="700">S1</text>
      <circle cx="118" cy="106" r="6.5" fill="#0B1120" stroke="#A855F7" stroke-width="1.5"/>
      <text x="118" y="109" fill="#A855F7" font-weight="700">S2</text>
      <circle cx="118" cy="126" r="6.5" fill="#0B1120" stroke="#FB923C" stroke-width="1.5"/>
      <text x="118" y="129" fill="#FB923C" font-weight="700">S3</text>
      <circle cx="118" cy="146" r="6.5" fill="#0B1120" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>
      <text x="118" y="149" fill="#10B981" font-weight="700" opacity="0.7">S4</text>
    </g>
  </g>

  <!-- 底部标题 -->
  <text x="100" y="190" font-family="-apple-system,system-ui,sans-serif" font-size="8.5" fill="#CBD5E1" text-anchor="middle" font-weight="600" letter-spacing="0.5">阶段双向门禁</text>
</svg>